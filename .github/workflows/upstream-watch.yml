name: upstream-watch

# The whole repo is pinned to one upstream commit. When upstream moves, some
# claims here quietly become wrong. This job is the reminder to go read the diff.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: deepseek-ai/dsh-superagent-prototype
  PINNED: 6337fc823ce20251c8de8085948165c81aaa701e

jobs:
  drift:
    name: compare pinned commit with upstream head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream drift and open an issue if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          head_sha=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          echo "pinned: $PINNED"
          echo "head:   $head_sha"

          if [ "$PINNED" = "$head_sha" ]; then
            echo "No drift. Nothing to do."
            exit 0
          fi

          ahead=$(gh api "repos/$UPSTREAM/compare/$PINNED...main" --jq .total_commits)
          echo "upstream is $ahead commit(s) ahead of the pinned sha"

          existing=$(gh issue list --state open --search 'in:title "upstream drift"' \
            --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "an open drift issue already exists; leaving it alone"
            exit 0
          fi

          short=${PINNED:0:7}
          {
            echo "Upstream moved past the commit this repo is pinned to."
            echo
            echo "- pinned: \`$PINNED\`"
            echo "- head: \`$head_sha\`"
            echo "- commits ahead: $ahead"
            echo "- compare: https://github.com/$UPSTREAM/compare/$PINNED...main"
            echo
            echo "What to do:"
            echo
            echo "1. Read the diff. Look for behavioural changes, not just docs."
            echo "2. For each article, decide whether a claim is now wrong."
            echo "3. Either correct the text, or add a note saying which commit it"
            echo "   describes, and bump the pin in README + NOTICE + this file."
            echo
            echo "Generated by .github/workflows/upstream-watch.yml"
          } > /tmp/body.md

          gh issue create --title "upstream drift: $ahead commit(s) since $short" \
            --body-file /tmp/body.md
