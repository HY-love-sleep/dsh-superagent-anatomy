name: upstream-watch

# The whole repo is pinned to one upstream commit. When upstream moves, some
# claims here quietly become wrong. This job is the reminder to go read the diff.
#
# The pinned commit can also drop off upstream main entirely when its history is
# rewritten. That must not make the job fail: the content tree still tells us
# whether any prose needs to change.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM: deepseek-ai/dsh-superagent-prototype
  PINNED: 6337fc823ce20251c8de8085948165c81aaa701e

jobs:
  drift:
    name: compare pinned commit with upstream head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for upstream drift and open an issue if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          head_sha=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          head_tree=$(gh api "repos/$UPSTREAM/commits/$head_sha" --jq .commit.tree.sha)
          echo "pinned: $PINNED"
          echo "head:   $head_sha"

          if [ "$PINNED" = "$head_sha" ]; then
            echo "No drift. Nothing to do."
            exit 0
          fi

          # The pin may be an orphan if upstream rewrote history. Compare the
          # content trees first: identical trees mean no claim in this repo
          # needs editing, even when the commit graph diverged.
          pinned_tree=$(gh api "repos/$UPSTREAM/commits/$PINNED" \
            --jq .commit.tree.sha 2>/dev/null) || pinned_tree=""
          if [ -z "$pinned_tree" ]; then
            content="unknown (pinned commit is not readable)"
          elif [ "$pinned_tree" = "$head_tree" ]; then
            content="identical"
          else
            content="changed"
          fi

          # A compare of unrelated histories returns 404. Treat that as drift
          # too: the permalinks point at a commit that can eventually be pruned.
          if ahead=$(gh api "repos/$UPSTREAM/compare/$PINNED...main" \
            --jq .total_commits 2>/dev/null); then
            diverged=false
            echo "upstream is $ahead commit(s) ahead of the pinned sha"
          else
            diverged=true
            ahead="unknown"
            echo "pinned commit is not an ancestor of main (history rewritten)"
          fi

          if [ "$content" = "identical" ] && [ "$diverged" = false ]; then
            echo "No content drift. Nothing to do."
            exit 0
          fi

          existing=$(gh issue list --state open --search 'in:title "upstream drift"' \
            --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "an open drift issue already exists; leaving it alone"
            exit 0
          fi

          short=${PINNED:0:7}
          head_short=${head_sha:0:7}
          {
            echo "Upstream no longer matches the commit this repo is pinned to."
            echo
            echo "- pinned: \`$PINNED\`"
            echo "- head: \`$head_sha\` (\`main\`)"
            echo "- content tree: $content"
            echo "- commits ahead: $ahead"
            if [ "$diverged" = true ]; then
              echo "- history: diverged — the pinned commit is not an ancestor of \`main\`"
            fi
            echo "- pinned commit: https://github.com/$UPSTREAM/commit/$PINNED"
            echo "- head commit: https://github.com/$UPSTREAM/commit/$head_sha"
            if [ "$diverged" = false ]; then
              echo "- compare: https://github.com/$UPSTREAM/compare/$PINNED...main"
            fi
            echo
            echo "What to do:"
            echo
            if [ "$content" = "identical" ] && [ "$diverged" = true ]; then
              echo "The content tree is identical, so re-pinning is a mechanical sha"
              echo "update: the same lines exist at the new commit. Re-pin anyway,"
              echo "because permalinks to an orphan commit can be pruned."
              echo
            fi
            echo "1. Read the diff. Look for behavioural changes, not just docs."
            echo "2. For each article, decide whether a claim is now wrong."
            echo "3. Either correct the text, or add a note saying which commit it"
            echo "   describes. If you re-pin, update every file containing the sha:"
            echo "   grep -rln '$short' --exclude-dir=.git"
            echo
            echo "Generated by .github/workflows/upstream-watch.yml"
          } > /tmp/body.md

          title="upstream drift: $short vs $head_short"
          if [ "$content" = "identical" ] && [ "$diverged" = true ]; then
            title="upstream drift: pin $short is no longer on main"
          fi
          gh issue create --title "$title" --body-file /tmp/body.md
